# CertiFlow Render Blueprint
# Set the sync:false variables in the Render dashboard before the first deploy.
# Both services use the same S3-compatible bucket and managed MongoDB/Redis endpoints.
services:
  - type: web
    name: certiflow-api
    runtime: docker
    region: singapore
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile.api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_TYPE
        value: s3
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: certiflow_production
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SIGNED_URL_SECRET
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BASE_URL
        sync: false

  - type: worker
    name: certiflow-worker
    runtime: docker
    region: singapore
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile.worker
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_TYPE
        value: s3
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: certiflow_production
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SIGNED_URL_SECRET
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BASE_URL
        sync: false
