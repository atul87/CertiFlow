# CertiFlow Render Blueprint
# Configured for Render Free Plan (100% Zero-Cost Tier)
# Runs the API and an embedded ARQ worker inside the free web service.
services:
  - type: web
    name: certiflow-api
    plan: free
    runtime: docker
    region: singapore
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile.api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_TYPE
        value: s3
      - key: EMBEDDED_WORKER
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: certiflow_production
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SIGNED_URL_SECRET
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: S3_ENDPOINT
        value: ""
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BASE_URL
        sync: false

