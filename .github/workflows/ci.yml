name: CertiFlow CI/CD Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Install System Font Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements-dev.txt

      - name: Flake8 Linting & Syntax Validation
        working-directory: Backend
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for code style
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Pytest Suite with Coverage
        working-directory: Backend
        env:
          APP_ENV: test
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: certificate_platform_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-cd-testing-jwt-secret-key-min-32-chars-long!
          JWT_ALGORITHM: HS256
          BILLING_PROVIDER: mock
          BILLING_SECRET_KEY: ci_test_billing_secret_key
          BILLING_WEBHOOK_SECRET: ci_test_billing_webhook_secret
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80 tests/

  backend-docker-build:
    name: Backend Docker Build Verification
    runs-on: ubuntu-latest
    needs: backend-lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: Backend
          file: Backend/Dockerfile.api
          push: false
          tags: certiflow/api:ci-test

      - name: Build Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: Backend
          file: Backend/Dockerfile.worker
          push: false
          tags: certiflow/worker:ci-test

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Frontend E2E Tests
        run: npm run test:e2e -- --project=chromium

  frontend-docker-build:
    name: Frontend Docker Build Verification
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Standalone Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: certiflow/frontend:ci-test
