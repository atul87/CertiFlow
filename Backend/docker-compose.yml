version: '3.8'

services:
  certificate-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certiflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CertiFlow API
      - APP_ENV=development
      - DEBUG=true
      - API_V1_PREFIX=/api/v1
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=certificate_platform
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=certiflow-docker-compose-secret-key-min-32-chars-long!
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage

  certificate-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certiflow-worker
    restart: unless-stopped
    command: ["arq", "app.workers.worker.WorkerSettings"]
    environment:
      - APP_NAME=CertiFlow Worker
      - APP_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=certificate_platform
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=certiflow-docker-compose-secret-key-min-32-chars-long!
      - JWT_ALGORITHM=HS256
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage

  mongodb:
    image: mongo:7.0
    container_name: certiflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=certificate_platform
    volumes:
      - certiflow_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: certiflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - certiflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  certiflow_mongodb_data:
    driver: local
  certiflow_redis_data:
    driver: local
